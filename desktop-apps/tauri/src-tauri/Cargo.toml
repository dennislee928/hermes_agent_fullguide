[package]
name = "hermes-tauri"
version = "1.0.0"
description = "Hermes AI desktop chat app"
authors = ["Hermes"]
edition = "2021"

[lib]
name = "hermes_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
