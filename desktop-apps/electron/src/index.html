<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column;
           height: 100vh; }
    header { padding: 16px 20px; background: #111; border-bottom: 1px solid #333;
             display: flex; align-items: center; gap: 12px; -webkit-app-region: drag; }
    header h1 { font-size: 16px; font-weight: 600; }
    select { background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; border-radius: 6px;
             padding: 4px 8px; font-size: 13px; -webkit-app-region: no-drag; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
    .user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
    .assistant { background: #2a2a2a; align-self: flex-start; border-bottom-left-radius: 4px; }
    footer { padding: 16px 20px; background: #111; border-top: 1px solid #333;
             display: flex; gap: 10px; }
    textarea { flex: 1; background: #2a2a2a; color: #e0e0e0; border: 1px solid #444;
               border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none;
               font-family: inherit; height: 48px; }
    textarea:focus { outline: none; border-color: #2563eb; }
    button { background: #2563eb; color: white; border: none; border-radius: 8px;
             padding: 0 20px; font-size: 14px; cursor: pointer; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #374151; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Hermes</h1>
    <select id="model-select"><option>Loading models...</option></select>
  </header>
  <div id="messages"></div>
  <footer>
    <textarea id="input" placeholder="Message Hermes..." rows="1"></textarea>
    <button id="send">Send</button>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
